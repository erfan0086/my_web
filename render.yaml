# دیپلوی یک‌کلیکی روی Render.com
# داشبورد Render: New → Blueprint → انتخاب این ریپازیتوری
services:
  - type: web
    name: my-web-server
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PRICE_SCHEDULE
        value: "*/30 * * * *"
      - key: DATA_DIR
        value: /app/data
      # اختیاری: منبع نرخ ارز برای بروزرسانی خودکار قیمت
      # - key: RATE_SOURCE_URL
      #   value: https://example.com/api/rates
      # اختیاری: محدود کردن IPهای مجاز پنل
      # - key: ADMIN_IP_ALLOWLIST
      #   value: 1.2.3.4,5.6.7.8
